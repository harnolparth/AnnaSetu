<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AnnaSetu - Statistics</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div id="toast"></div>
    <div class="app">
        <aside class="sidebar">
            <div class="side-brand">
                <div class="logo">A</div>
                <div><b>AnnaSetu</b><small id="role"></small></div>
            </div>
            <nav class="nav" id="nav"></nav><button class="logout" id="logout">↪ &nbsp; Sign Out</button>
        </aside>
        <main class="main">
            <header class="top">
                <div>
                    <h2>Statistics</h2>
                    <p>AnnaSetu · Food Donation Management System</p>
                </div>
                <div class="top-user">
                    <div>
                        <div class="name" id="topName"></div>
                        <div class="role-text" id="topRole"></div>
                    </div>
                    <div class="avatar" id="avatar">AN</div>
                </div>
            </header>
            <section class="content">
                <div class="page-intro">
                    <h1>Platform Statistics</h1>
                    <p>Live counts returned by the Flask admin API.</p>
                </div>
                <div class="grid cards" id="cards"></div>
                <div class="panel">
                    <div class="section-title">
                        <h3>Platform Overview</h3><span>Current database counts</span>
                    </div>
                    <div class="chart"><canvas id="chart"></canvas></div>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
